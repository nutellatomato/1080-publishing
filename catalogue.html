<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue — 1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=1793146334">
<style>
.tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 40px; }
.tools input { font: inherit; font-size: 15px; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 8px; background: #fff; width: min(320px, 100%); color: var(--ink); }
.tools input:focus { outline: 2px solid var(--tomato); outline-offset: -1px; }
.chip { font: inherit; font-size: 13px; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 99px; background: none; color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.count { margin-left: auto; font-size: 13px; color: var(--muted); }
.tracks { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 14px; }
.tracks th { text-align: left; font-weight: 400; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 12px 10px 0; border-bottom: 1px solid var(--rule); }
.tracks td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.tracks td:first-child { width: 36px; }
.tracks .play { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--rule); background: #fff; cursor: pointer; display: grid; place-items: center; }
.tracks .play::before { content: ""; border-left: 8px solid var(--ink); border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
.tracks tr:hover .play { border-color: var(--tomato); }
.tracks tr:hover .play::before { border-left-color: var(--tomato); }
.tracks b { font-weight: 500; }
.tracks .dim { color: var(--muted); }
.wrap { overflow-x: auto; }
.empty { padding: 32px 0; color: var(--muted); }
@media (max-width: 760px) { .tracks .hide-s { display: none; } .count { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="page">
  <header class="top"></header>

  <main class="content">
    <h1>Catalogue</h1>
    <p class="lead">Search our songs by title, writer or genre. All tracks are available for sync.</p>

    <div class="tools">
      <input type="search" placeholder="Search titles or writers" aria-label="Search catalogue">
      <div class="chips"></div>
      <span class="count"></span>
    </div>

    <div class="wrap">
      <table class="tracks">
        <thead><tr><th></th><th>Title</th><th>Writers</th><th>Genre</th><th class="hide-s">BPM</th><th class="hide-s">Key</th><th class="hide-s">Length</th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="empty" hidden>No tracks match.</p>
    </div>
  </main>

  <footer class="foot" id="contact"></footer>
</div>
<script src="site.js?v=1793146334"></script>
<script src="spiral.js?v=1793146334"></script>
<script>
// Dummy catalogue data.
const TRACKS = [
  ["Track title 01", "Writer A, Writer B", "Electronic", 124, "A min", "3:42"],
  ["Track title 02", "Writer C", "Indie", 96, "D maj", "3:15"],
  ["Track title 03", "Writer A", "Hip-hop", 88, "F min", "2:58"],
  ["Track title 04", "Writer D, Writer E", "Ambient", 70, "C maj", "4:30"],
  ["Track title 05", "Writer B", "Pop", 118, "G maj", "3:05"],
  ["Track title 06", "Writer F", "Electronic", 128, "E min", "5:12"],
  ["Track title 07", "Writer C, Writer G", "Indie", 140, "B♭ maj", "3:37"],
  ["Track title 08", "Writer H", "Score", 60, "D min", "2:20"],
  ["Track title 09", "Writer A", "Pop", 102, "A maj", "3:28"],
  ["Track title 10", "Writer E", "Hip-hop", 92, "C min", "3:01"],
  ["Track title 11", "Writer D", "Ambient", 76, "F maj", "6:04"],
  ["Track title 12", "Writer G, Writer H", "Score", 110, "G min", "1:48"],
];
const GENRES = ["All", ...new Set(TRACKS.map(t => t[2]))];

const tbody = document.querySelector(".tracks tbody"), input = document.querySelector(".tools input");
const chips = document.querySelector(".chips"), count = document.querySelector(".count"), empty = document.querySelector(".empty");
let genre = "All";

chips.style.cssText = "display:flex;flex-wrap:wrap;gap:8px";
GENRES.forEach(g => {
  const b = Object.assign(document.createElement("button"), { className: "chip", textContent: g });
  b.setAttribute("aria-pressed", g === genre);
  b.onclick = () => { genre = g; chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); render(); };
  chips.append(b);
});

function render() {
  const q = input.value.trim().toLowerCase();
  const rows = TRACKS.filter(t => (genre === "All" || t[2] === genre) && (t[0] + " " + t[1]).toLowerCase().includes(q));
  tbody.replaceChildren(...rows.map(([title, writers, g, bpm, key, len]) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><button class="play" aria-label="Play ${title}"></button></td><td><b></b></td><td class="dim"></td><td></td><td class="hide-s dim">${bpm}</td><td class="hide-s dim"></td><td class="hide-s dim">${len}</td>`;
    const c = tr.children;
    c[1].firstChild.textContent = title; c[2].textContent = writers; c[3].textContent = g; c[5].textContent = key;
    return tr;
  }));
  count.textContent = `${rows.length} of ${TRACKS.length} tracks`;
  empty.hidden = rows.length > 0;
}
input.addEventListener("input", render);
render();
</script>
</body>
</html>
