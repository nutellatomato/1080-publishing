<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — 1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=1793146334">
<style>
.big-mail { display: inline-block; margin-top: 32px; font-size: clamp(24px, 3.4vw, 44px); font-weight: 300; letter-spacing: -0.03em; border-bottom: 1px solid currentColor; padding-bottom: 4px; }
.rows { border-top: 1px solid var(--rule); max-width: 760px; }
.rows div { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.rows dt { color: var(--muted); }
.rows dd { line-height: 1.5; }
@media (max-width: 640px) { .rows div { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body>
<div class="page">
  <header class="top"></header>

  <main class="content">
    <h1>Contact</h1>
    <p class="lead">Send us a brief, a demo or a question. We reply within two working days.</p>
    <a class="big-mail" href="mailto:contact@1080publishing.com">contact@1080publishing.com</a>

    <h2>Details</h2>
    <dl class="rows">
      <div><dt>Publishing</dt><dd>Writer and catalogue enquiries</dd></div>
      <div><dt>Music Supervision</dt><dd>Briefs for film, TV, advertising and games</dd></div>
      <div><dt>Sync</dt><dd>Licence requests and quotes</dd></div>
      <div><dt>Address</dt><dd>Street 00<br>00000 City<br>Country</dd></div>
    </dl>
  </main>

  <footer class="foot"></footer>
</div>
<script src="site.js?v=1793146334"></script>
<script src="spiral.js?v=1793146334"></script>
</body>
</html>
